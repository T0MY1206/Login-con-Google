<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login con Google</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main id="view-home" class="panel">
    <h1>Bienvenido</h1>
    <div id="home-logged-out">
      <div id="google-btn-wrap"></div>
    </div>
    <div id="home-logged-in" hidden>
      <p>Hola, <span id="home-name"></span>!</p>
      <p><a href="#" id="to-profile" class="btn-link">Ir a perfil</a></p>
      <p><button type="button" id="btn-logout-home" class="btn-danger">Cerrar sesión</button></p>
    </div>
  </main>

  <main id="view-profile" class="panel" hidden>
    <h1>Perfil</h1>
    <p>Nombre: <span id="profile-name"></span></p>
    <p>Email: <span id="profile-email"></span></p>
    <img id="profile-photo" alt="avatar" width="100" height="100" hidden />
    <p><a href="#" id="link-home" class="btn-link">Volver al inicio</a></p>
    <p><button type="button" id="btn-logout" class="btn-danger">Cerrar sesión</button></p>
  </main>

  <script src="config.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
